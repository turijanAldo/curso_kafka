spring:
  application:
    name: status-service

  # ── Base de datos ────────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/transfers_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: lab_user
    password: lab_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # validate → Hibernate verifica que Transaction.java coincide con la tabla
      # transactions que Flyway (y transfer-api) ya crearon.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Flyway ───────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_history_status
    baseline-on-migrate: true

  # ── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      # status-group consume TODOS los eventos del Saga para actualizar
      # el estado de la transferencia en la tabla transactions.
      # Escucha: transfer.validated, transfer.failed, transfer.debited,
      #          transfer.credited, transfer.compensated
      group-id: status-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.lab.*
        auto.offset.reset: earliest
        enable.auto.commit: false

    # status-service NO produce eventos Kafka.
    # Solo consume y actualiza la DB. Es el "sink" final del Saga.
    # Si necesitara producir en el futuro (ej: notificaciones push),
    # se agregaría aquí la configuración del producer.

    listener:
      ack-mode: MANUAL_IMMEDIATE

# ── Servidor ─────────────────────────────────────────────────────────────
server:
  port: 8083

# ── Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    com.lab: DEBUG
    org.springframework.kafka: INFO
    org.flywaydb: INFO
