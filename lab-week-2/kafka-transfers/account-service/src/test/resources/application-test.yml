# ── Perfil de test para account-service ────────────────────────────────────
# Activo cuando los tests usan @ActiveProfiles("test").
#
# A diferencia de validation-service, account-service usa Testcontainers:
# levanta un MySQL real y un Kafka real en Docker para los integration tests.
#
# Las propiedades de conexión (datasource.url, kafka.bootstrap-servers)
# son sobreescritas dinámicamente por @DynamicPropertySource en
# AbstractContainerBaseTest, DESPUÉS de que los contenedores arrancan.
# Los valores aquí son placeholders que nunca se usan.

spring:
  application:
    name: account-service-test

  # ── Placeholder — sobreescrito por @DynamicPropertySource ────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/transfers_db
    username: lab_user
    password: lab_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # validate: Hibernate verifica que el schema creado por Flyway coincide
      # con las entidades. Con Testcontainers MySQL real, Flyway corre primero.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  # ── Flyway habilitado — corre contra el MySQL de Testcontainers ───────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_history_account
    baseline-on-migrate: true

  # ── Kafka — sobreescrito por @DynamicPropertySource ──────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-debit-group-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.lab.*
        auto.offset.reset: earliest
        enable.auto.commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: MANUAL_IMMEDIATE

app:
  simulate-credit-failure: false

server:
  port: 0

logging:
  level:
    com.lab: DEBUG
    org.springframework.kafka: WARN
    org.flywaydb: INFO
    org.testcontainers: INFO
