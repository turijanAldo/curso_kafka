spring:
  application:
    name: transfer-api

  # ── Base de datos ────────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/transfers_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: lab_user
    password: lab_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # validate → Hibernate verifica que las entidades coinciden con el schema
    # pero NO modifica las tablas. Flyway es quien gestiona el schema.
    hibernate:
      # validate → Hibernate verifica que Transaction.java coincide con la tabla
      # transactions que Flyway creó. Si hay un campo en la entidad que no
      # existe en la tabla (o viceversa), el arranque falla con un error claro.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Redis — caché de estado de transferencias (Bonus A) ─────────────────
  data:
    redis:
      host: localhost
      port: 6379
      # Sin password en el lab. En producción: requirepass en redis.conf
      timeout: 2000ms          # timeout de conexión/comando

  # ── Flyway — migraciones automáticas de schema ──────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Tabla de historial ÚNICA por servicio para evitar conflictos en la
    # misma DB compartida. Cada servicio lleva su propio registro de qué
    # migraciones ya aplicó.
    table: flyway_history_transfer_api
    baseline-on-migrate: true

  # ── Kafka Producer ───────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Serializa la clave del mensaje (fromAccount) como String
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Serializa el valor (el evento Java) como JSON
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # CAPA 1 DE IDEMPOTENCIA: el producer Kafka asigna un ID de secuencia
      # a cada mensaje. Si el broker recibe el mismo mensaje dos veces
      # (porque el producer reintentó por timeout), lo descarta automáticamente.
      # Requiere: acks=all y retries > 0
      properties:
        enable.idempotence: true
        # acks=all → el broker confirma el mensaje solo cuando TODOS los
        # replicas en el ISR (In-Sync Replicas) lo escribieron. En lab con
        # 1 broker significa que el líder lo confirmó.
        acks: all
        # Máximo de reintentos si el producer no recibe confirmación
        retries: 3

# ── Servidor ─────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    com.lab: DEBUG
    org.springframework.kafka: INFO
    org.flywaydb: INFO
