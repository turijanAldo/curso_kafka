# ── Perfil de test para validation-service ─────────────────────────────────
# Activo cuando los tests usan @ActiveProfiles("test").
#
# Diferencias respecto a application.yml de producción:
#
#   datasource → H2 en memoria: sin Docker, sin MySQL, arranque instantáneo
#   flyway     → deshabilitado: H2 no puede ejecutar las migraciones MySQL
#   jpa        → ddl-auto: create-drop: Hibernate genera el schema desde las
#                entidades Java (Account, ProcessedEvent) y lo elimina al cerrar
#   kafka      → bootstrap-servers se sobreescribe por @EmbeddedKafka automáticamente
#                a través de EmbeddedKafkaBroker / spring.embedded.kafka.brokers

spring:
  application:
    name: validation-service-test

  # ── H2 en memoria ────────────────────────────────────────────────────────
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # create-drop: Hibernate crea el schema al arrancar el contexto de test
      # y lo elimina al cerrarlo. Perfecto para tests aislados.
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        # H2Dialect para compatibilidad con base de datos H2
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  # ── Flyway deshabilitado en tests ─────────────────────────────────────────
  # Las migraciones Flyway usan SQL específico de MySQL (ENGINE=InnoDB, etc.)
  # que H2 no puede procesar. ddl-auto: create-drop genera el schema desde
  # las entidades JPA sin necesitar las migraciones.
  flyway:
    enabled: false

  # ── Kafka: @EmbeddedKafka sobrescribe bootstrap-servers automáticamente ───
  # Spring Boot Test + spring-kafka-test inyecta la propiedad
  # spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
  # cuando detecta @EmbeddedKafka en el contexto de test.
  kafka:
    consumer:
      group-id: validation-group-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.lab.*
        auto.offset.reset: earliest
        enable.auto.commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: MANUAL_IMMEDIATE

server:
  port: 0  # Puerto aleatorio — evita conflictos entre tests paralelos

logging:
  level:
    com.lab: DEBUG
    org.springframework.kafka: WARN
    org.flywaydb: WARN
